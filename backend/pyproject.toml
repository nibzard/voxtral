[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxtral-backend"
version = "0.1.0"
description = "Local speech transcription backend using vLLM Metal with MLX acceleration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Voxtral"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "websockets>=12.0",
    "soxr>=0.3.6",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# vLLM Metal backend (Voxtral model).
voxtral = [
    "vllm==0.14.1",
    "vllm-metal==0.1.0",
    "mistral-common[audio]>=1.9.0",
]

# faster-whisper backend (CTranslate2). Recommended for Apple Silicon CPU/Metal.
whisper = [
    "faster-whisper>=1.1.0",
]

[project.scripts]
voxtral-backend = "voxtral_backend.server:main"

[tool.setuptools.packages.find]
include = ["voxtral_backend*"]

[tool.setuptools.package-data]
voxtral_backend = ["py.typed"]
